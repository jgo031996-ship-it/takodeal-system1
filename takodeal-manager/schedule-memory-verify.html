<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Schedule memory verification</title><link rel="stylesheet" href="./schedule-memory.css"><style>
body{margin:0;background:#f5f8f4;color:#173e31;font:15px Arial,sans-serif}main{max-width:1160px;margin:36px auto;padding:28px;background:white;border:1px solid #d9e4dc;border-radius:14px}h1{font-size:26px;margin:8px 0}p{color:#63796f;line-height:1.5}button,input,select{font:inherit;border:1px solid #cfdcd3;border-radius:7px;padding:10px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#17654f;color:white}section{margin:22px 0}.eyebrow{font-size:11px;letter-spacing:2px}#view-schedule table{width:100%;border-collapse:collapse}td,th{padding:14px;border-bottom:1px solid #e4ebe5;text-align:left}th{font-size:12px;color:#75897f}#results{background:#edf6ee;padding:22px;border-radius:10px}.check{padding:8px 0;color:#146044}.sample{background:#fff7e7;color:#796127;padding:12px;border-radius:7px}strong.metric{font-size:23px}#readOnly{font-size:13px;color:#697c73}
</style></head><body><main><div class="eyebrow">TAKODEÁL OWNER · LOCAL VERIFICATION</div><h1>Schedule Manager</h1><p>Preserve the shift reference for future attendance and payslips.</p><p class="sample">Sample staff and temporary data only. This preview does not connect to the live business database.</p><div id="view-schedule"><div style="display:flex;justify-content: space-between"><h2>Schedule & shift manager</h2><div><label>Month <input type="month" id="monthSelector" value="2026-10"></label></div></div><section><table><thead><tr><th>BRANCH</th><th>STAFF</th><th>SHIFT RULE</th><th>ASSIGNED DATE</th></tr></thead><tbody id="sampleSchedule"></tbody></table><p id="readOnly"></p></section></div><button id="verify" class="primary">Verify later edits preserve the original clock-in</button><section id="results" aria-live="polite">Ready to verify.</section></main><script type="module">
import {createScheduleHistoryStore} from '././schedule-history.js';
import {installScheduleMemoryUI} from '././schedule-memory-ui.js';
import {captureAttendanceSchedule,resolveAttendanceShift,latePay,earnedNightBonus} from '././payroll-safety.js';
const fixedNow=new Date('2026-10-06T08:00:00+08:00'),documents=new Map();let id=0,expected=null;
const snap=d=>({exists:()=>!!d,data:()=>structuredClone(d)});
const api={db:{},doc:(_,collection,id)=>collection+'/'+id,getDoc:async ref=>snap(documents.get(ref)),runTransaction:async(_,fn)=>{const staged=new Map();const result=await fn({get:async ref=>snap(documents.get(ref)),set:(ref,data)=>staged.set(ref,structuredClone(data))});for(const entry of staged)documents.set(...entry);return result;}};
const store=createScheduleHistoryStore(api,{now:()=>fixedNow,makeId:()=> 'sample-'+ ++id});
let current={currentYear:2026,currentMonth:10,branchConfig:{Cabantian:[{id:'mid',name:'Afternoon',startTime:'16:00',endTime:'00:30',shiftType:'mid',active:true,days:[0,1,2,3,4,5,6]}]},currentSchedule:{6:{Cabantian:{scheduled:{mid:'Sample Staff'},rest:[],unavailable:[]}}},employees:[{name:'Sample Staff',branch:'Cabantian'}],holidays:{},unavailability:{}};
const paint=()=>{document.getElementById('sampleSchedule').innerHTML=`<tr><td>Cabantian</td><td>Sample Staff</td><td>${current.branchConfig.Cabantian[0].startTime} → ${current.branchConfig.Cabantian[0].endTime}</td><td>${current.currentYear}-${String(current.currentMonth).padStart(2,'0')}-06</td></tr>`;};
await store.save(current,{effectiveFrom:'2026-10-06',actor:'sample-owner@example.test'});
const ui=installScheduleMemoryUI({document,store,getSnapshot:()=>current,applySnapshot:async value=>{current=value;paint();},setExpectedRevision:value=>expected=value,setReadOnly:value=>document.getElementById('readOnly').textContent=value?'Saved version · read-only':'Current editor · changes are saved as a new version'});await ui.refresh();paint();
document.getElementById('verify').onclick=async()=>{try{
 const history=await store.loadRange('2026-10-06','2026-10-06'),timestamp=new Date('2026-10-06T16:05:00+08:00');
 const entry={staffName:'Sample Staff',branch:'Cabantian',timestamp,scheduleSnapshot:captureAttendanceSchedule(timestamp,'Cabantian','Sample Staff',history)};
 const original=resolveAttendanceShift(entry,history),profile={hourlyRate:500,nightDiffRate:50};
 const changed=structuredClone(current);changed.branchConfig.Cabantian[0].startTime='09:00';changed.branchConfig.Cabantian[0].endTime='17:00';changed.branchConfig.Cabantian[0].shiftType='morning';
 await store.save(changed,{effectiveFrom:'2026-10-06',expectedRevisionId:expected,actor:'sample-owner@example.test'});current=changed;await ui.refresh();paint();
 const november={...changed,currentMonth:11,currentSchedule:{6:{Cabantian:{scheduled:{mid:'Sample Staff'}}}}};await store.save(november,{effectiveFrom:'2026-11-01',actor:'sample-owner@example.test'});
 const finalHistory=await store.loadRange('2026-10-06','2026-11-06'),later=resolveAttendanceShift(entry,finalHistory);
 if(later.lateMinutes!==original.lateMinutes||+later.expectedStartAt!==+original.expectedStartAt||latePay(later.lateMinutes,profile,later).amount!==latePay(original.lateMinutes,profile,original).amount||earnedNightBonus(profile,later,new Date('2026-10-07T00:35:00+08:00'))!==50)throw Error('Preservation check failed');
 document.getElementById('results').innerHTML='<h2>Verification passed</h2><p>Sample clock-in: October 6 at 4:05 PM. Original shift: 4:00 PM–12:30 AM.</p><strong class="metric">5 minutes late · original reference retained</strong><div class="check">✓ Same-day shift edit did not change the recorded start or end.</div><div class="check">✓ November planning did not replace October attendance.</div><div class="check">✓ Late deduction and completed night bonus stayed consistent.</div><div class="check">✓ Prior schedule versions remain available in Saved versions.</div>';
 }catch(error){document.getElementById('results').textContent='Verification failed: '+error.message;}};
</script></body></html>
