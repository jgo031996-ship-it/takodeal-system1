<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAKODEÁL Rider</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary: #0ea5e9;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100dvh; display: flex; flex-direction: column;
        }

        /* 🚀 TOP NAVIGATION */
        .top-bar {
            background: var(--card-bg); padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #334155; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .rider-profile { font-size: 18px; font-weight: 900; color: var(--primary); }
        .status-badge { background: var(--success); color: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }

        /* 📦 DISPATCH BOARD */
        .board-container {
            flex: 1; overflow-y: auto; padding: 15px;
            display: flex; flex-direction: column; gap: 15px;
        }

        /* 🛵 ORDER CARDS */
        .order-card {
            background: var(--card-bg); border-radius: 16px; padding: 20px;
            border: 1px solid #334155; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .order-header { display: flex; justify-content: space-between; border-bottom: 1px dashed #475569; padding-bottom: 10px; margin-bottom: 10px; }
        .order-id { font-size: 18px; font-weight: 900; color: #facc15; }
        .order-total { font-size: 18px; font-weight: 900; color: var(--success); }
        
        .customer-info { font-size: 15px; margin-bottom: 15px; line-height: 1.4; }
        .customer-name { font-size: 20px; font-weight: 900; color: white; display: block; }
        
        /* 🗺️ BIG ACTION BUTTONS */
        .btn-map {
            background: #3b82f6; color: white; border: none; padding: 16px;
            border-radius: 10px; font-weight: 900; font-size: 16px; width: 100%;
            margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-action {
            background: var(--success); color: white; border: none; padding: 18px;
            border-radius: 10px; font-weight: 900; font-size: 18px; width: 100%;
            cursor: pointer; box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="rider-profile">🛵 Rider Hub</div>
        <div class="status-badge" id="riderStatus">ONLINE</div>
    </div>

    <div class="board-container" id="dispatchBoard">
        <div style="text-align: center; color: var(--text-muted); padding: 40px; font-weight: bold;">
            ⏳ Searching for ready orders...
        </div>
    </div>

    <!-- Firebase App (the core Firebase SDK) -->
    <script type="module" src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
