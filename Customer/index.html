<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAKODEÁL - Mobile Order</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 pb-24">

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <!-- Header -->
        <div class="bg-red-600 p-6 text-center text-white">
            <h1 class="text-3xl font-black tracking-wider">TAKODEÁL</h1>
            <p class="text-sm opacity-80 mt-1">Your ideal takoyaki & Coffee</p>
        </div>

        <form id="orderForm" class="p-6 space-y-6">
            <!-- Customer Name -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Who is this order for?</label>
                <input type="text" id="customerName" required class="block w-full rounded-lg border-gray-300 bg-gray-50 p-3 border focus:border-red-500 focus:ring-red-500 outline-none transition" placeholder="Enter your name...">
            </div>

            <!-- LIVE MENU GRID -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-3">Select Your Items</label>
                
                <!-- This is where Firebase will inject the menu items -->
                <div id="liveMenuContainer" class="grid grid-cols-2 gap-3">
                    <div class="col-span-2 text-center py-8 text-gray-400 font-medium">
                        Loading live menu...
                    </div>
                </div>
            </div>

            <hr class="border-gray-200">

            <!-- Payment Method -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Mode of Payment</label>
                <select id="paymentMode" class="block w-full rounded-lg border-gray-300 bg-gray-50 p-3 border focus:border-red-500 outline-none transition" onchange="togglePaymentView()">
                    <option value="cash">Cash (Pay at counter)</option>
                    <option value="gcash">GCash</option>
                </select>
            </div>

            <!-- Hidden GCash Section -->
            <div id="gcashSection" class="hidden bg-blue-50 p-5 rounded-xl border border-blue-200 text-center">
                <p class="font-bold text-blue-800 mb-3">Pay via GCash</p>
                <div class="w-40 h-40 bg-white mx-auto flex items-center justify-center mb-3 rounded-lg shadow-sm border border-blue-100 overflow-hidden">
                    <span class="text-gray-400 text-sm">[Insert QR Here]</span>
                </div>
                <p class="text-sm font-bold text-gray-800">Account: JOSTUART O.</p>
                <p class="text-sm text-gray-600 mb-3">No: 09XX-XXX-XXXX</p>
                <input type="text" id="refNumber" class="block w-full rounded-lg border-gray-300 p-2 text-center text-sm outline-none focus:border-blue-500" placeholder="Enter Ref No. (Optional)">
            </div>

            <!-- Sticky Submit Button -->
            <div class="fixed bottom-0 left-0 w-full p-4 bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-50 md:relative md:bg-transparent md:border-none md:shadow-none md:p-0">
                <button type="submit" id="submitBtn" class="w-full max-w-md mx-auto block bg-red-600 text-white font-bold py-4 px-4 rounded-xl hover:bg-red-700 active:scale-95 transition-all shadow-lg flex justify-between items-center">
                    <span>Send Order</span>
                    <span id="floatingTotal">₱0.00</span>
                </button>
            </div>
        </form>

        <div id="successMessage" class="hidden m-6 p-6 bg-green-50 border border-green-200 text-green-800 rounded-xl text-center">
            <div class="text-4xl mb-2">✅</div>
            <h2 class="font-bold text-lg mb-1">Order Sent!</h2>
            <p class="text-sm opacity-80">We've received your order. Please wait for your name to be called.</p>
        </div>
    </div>

    <!-- Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmAWBbW7tTnIQkm2kTcJ-MLrjKHNGKcp4",
            authDomain: "takodeal-pos.firebaseapp.com",
            projectId: "takodeal-pos",
            storageBucket: "takodeal-pos.firebasestorage.app",
            messagingSenderId: "248826111383",
            appId: "1:248826111383:web:48bf1e2c172298079bd0d2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // State to keep track of what the customer is ordering
        window.cartState = {};
        window.cartTotal = 0;

        // Fetch Live Menu
        async function loadLiveMenu() {
            try {
                const snap = await getDocs(collection(db, "menu"));
                const container = document.getElementById('liveMenuContainer');
                container.innerHTML = '';
                let itemsRendered = 0;

                snap.forEach(doc => {
                    const item = doc.data();
                    
                    // TOGGLE FEATURE: Only show if it is NOT explicitly turned off
                    if (item.isAvailable !== false) {
                        itemsRendered++;
                        let price = parseFloat(item.price || item.basePrice || 0);
                        let safeName = item.name.replace(/'/g, "\\'"); // escape quotes
                        
                        // Picture Feature: Use real image or a beautiful placeholder
                        let imgHtml = item.image 
                            ? `<img src="${item.image}" class="w-full h-28 object-cover">` 
                            : `<div class="w-full h-28 bg-orange-50 flex items-center justify-center text-3xl">🍲</div>`;

                        container.innerHTML += `
                            <div class="border border-gray-100 rounded-xl shadow-sm bg-white overflow-hidden flex flex-col">
                                ${imgHtml}
                                <div class="p-3 flex-1 flex flex-col justify-between">
                                    <div>
                                        <p class="font-bold text-sm text-gray-800 leading-tight mb-1">${item.name}</p>
                                        <p class="text-xs font-bold text-red-600">₱${price.toFixed(2)}</p>
                                    </div>
                                    <div class="mt-3 bg-gray-100 rounded-lg flex items-center justify-between p-1">
                                        <button type="button" class="w-8 h-8 flex items-center justify-center bg-white rounded shadow-sm text-gray-600 font-bold active:scale-90 transition" onclick="updateQty('${doc.id}', -1, ${price}, '${safeName}')">-</button>
                                        <span id="qty-${doc.id}" class="font-bold text-sm w-6 text-center">0</span>
                                        <button type="button" class="w-8 h-8 flex items-center justify-center bg-red-600 rounded shadow-sm text-white font-bold active:scale-90 transition" onclick="updateQty('${doc.id}', 1, ${price}, '${safeName}')">+</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                });

                if(itemsRendered === 0) {
                    container.innerHTML = '<div class="col-span-2 text-center py-8 text-gray-400">Menu is currently unavailable.</div>';
                }
            } catch (error) {
                console.error("Menu Load Error:", error);
                document.getElementById('liveMenuContainer').innerHTML = '<div class="col-span-2 text-center py-8 text-red-400">Failed to load menu.</div>';
            }
        }

        // Handle Quantity Buttons
        window.updateQty = function(id, delta, price, name) {
            if (!window.cartState[id]) window.cartState[id] = { name: name, price: price, qty: 0 };
            
            window.cartState[id].qty += delta;
            if (window.cartState[id].qty < 0) window.cartState[id].qty = 0;
            
            document.getElementById(`qty-${id}`).innerText = window.cartState[id].qty;
            calculateTotal();
        }

        // Calculate Floating Total
        function calculateTotal() {
            window.cartTotal = 0;
            for (let id in window.cartState) {
                window.cartTotal += (window.cartState[id].qty * window.cartState[id].price);
            }
            document.getElementById('floatingTotal').innerText = `₱${window.cartTotal.toFixed(2)}`;
        }

        // Handle Payment Toggle
        window.togglePaymentView = function() {
            const mode = document.getElementById('paymentMode').value;
            const gcashSection = document.getElementById('gcashSection');
            if (mode === 'gcash') gcashSection.classList.remove('hidden');
            else gcashSection.classList.add('hidden');
        }

        // Submit Order
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const urlParams = new URLSearchParams(window.location.search);
            const currentBranch = urlParams.get('branch') || "Main Office"; 

            const name = document.getElementById('customerName').value;
            const paymentMode = document.getElementById('paymentMode').value;
            const refNumber = document.getElementById('refNumber')?.value || "";
            
            let finalItems = [];
            for (let id in window.cartState) {
                if (window.cartState[id].qty > 0) {
                    finalItems.push({
                        name: window.cartState[id].name,
                        quantity: window.cartState[id].qty,
                        price: window.cartState[id].price
                    });
                }
            }

            if (finalItems.length === 0) {
                alert("Please select at least one item.");
                return;
            }

            const orderData = {
                customerName: name,
                branch: currentBranch,
                items: finalItems,
                totalAmount: window.cartTotal,
                paymentMode: paymentMode,
                gcashRef: paymentMode === 'gcash' ? refNumber : null,
                status: "mobile_queue",
                timestamp: serverTimestamp()
            };

            try {
                const btn = document.getElementById('submitBtn');
                btn.innerHTML = '<span class="mx-auto">Sending...</span>';
                btn.disabled = true;

                await addDoc(collection(db, "incoming_orders"), orderData);
                
                document.getElementById('orderForm').classList.add('hidden');
                document.getElementById('successMessage').classList.remove('hidden');
                window.scrollTo(0,0);
            } catch (error) {
                console.error(error);
                alert("Error sending order. Please try again.");
                document.getElementById('submitBtn').innerHTML = '<span>Send Order</span><span id="floatingTotal">₱'+window.cartTotal.toFixed(2)+'</span>';
                document.getElementById('submitBtn').disabled = false;
            }
        });

        // Initialize Menu on load
        loadLiveMenu();
    </script>
</body>
</html>
