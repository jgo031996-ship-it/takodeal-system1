<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAKODEÁL - Mobile Order</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="customer-logo.png">
    <link rel="apple-touch-icon" href="customer-logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        .search-bar-container { position: sticky; top: 76px; z-index: 30; background: white; padding: 10px 24px; border-bottom: 1px solid #f3f4f6; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-24">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative flex flex-col">
        <!-- Header -->
        <div class="sticky top-0 z-40 shadow-md bg-white flex justify-center items-center overflow-hidden">
            <!-- Change 'banner.png' to 'banner.jpg' if your file is a JPG -->
            <img src="banner.png" alt="TAKODEÁL Banner" class="w-full h-auto max-h-32 object-contain">
        </div>
        <div id="orderingScreen" class="flex-1">
            <!-- Search Bar -->
            <div class="search-bar-container shadow-sm">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">🔍</span>
                    <input type="text" id="searchInput" onkeyup="filterMenu()" class="w-full bg-gray-100 rounded-lg pl-10 pr-4 py-2 text-sm outline-none focus:ring-2 focus:ring-red-500" placeholder="Search for takoyaki, drinks...">
                </div>
            </div>

            <div class="p-6">
                <!-- Customer Name -->
                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-700 mb-1">Who is this order for?</label>
                    <input type="text" id="customerName" required class="block w-full rounded-lg border-gray-300 bg-gray-50 p-3 border focus:border-red-500 outline-none" placeholder="Enter your name...">
                </div>

                <!-- LIVE CATEGORY ACCORDIONS (Closed by Default) -->
                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-700 mb-3">Menu Categories</label>
                    <div id="liveMenuContainer" class="space-y-3">
                        <div class="text-center py-8 text-gray-400 font-medium">Loading live menu...</div>
                    </div>
                </div>

                <hr class="border-gray-200 my-6">

                <!-- Payment Method -->
                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-700 mb-1">Mode of Payment</label>
                    <select id="paymentMode" class="block w-full rounded-lg border-gray-300 bg-gray-50 p-3 border focus:border-red-500 outline-none" onchange="togglePaymentView()">
                        <option value="cash">Cash (Pay at counter)</option>
                        <option value="gcash">GCash</option>
                    </select>
                </div>

                <!-- Hidden GCash Section -->
                <div id="gcashSection" class="hidden bg-blue-50 p-5 rounded-xl border border-blue-200 text-center mb-6">
                    <p class="font-bold text-blue-800 mb-3">Pay via GCash</p>
                    <div class="w-40 h-40 bg-white mx-auto flex items-center justify-center mb-3 rounded-lg shadow-sm border border-blue-100">
                        <img src="QR.jpg" alt="GCash QR Code" style="max-width: 100%; max-height: 100%; object-fit: contain;">
                    </div>
                    <p class="text-sm font-bold text-gray-800">Account: JOSTUART O.</p>
                    <p class="text-sm text-gray-600 mb-3">No: 09629721305</p>
                    <input type="text" id="refNumber" class="block w-full rounded-lg border-gray-300 p-2 text-center text-sm outline-none focus:border-blue-500" placeholder="Enter Ref No. (Optional)">
                </div>
            </div>

            <!-- Sticky Submit Button -->
            <div class="fixed bottom-0 left-0 w-full p-4 bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40 md:relative md:bg-transparent md:border-none md:shadow-none md:p-6 md:pt-0">
                <button onclick="submitOrder()" id="submitBtn" class="w-full max-w-md mx-auto block bg-red-600 text-white font-bold py-4 px-4 rounded-xl hover:bg-red-700 active:scale-95 transition-all shadow-lg flex justify-between items-center">
                    <span>Send Order</span>
                    <span id="floatingTotal">₱0.00</span>
                </button>
            </div>
        </div>

        <!-- TRACKER SCREEN -->
        <div id="trackerScreen" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center bg-gray-50">
            <div id="trackerIcon" class="text-6xl mb-4 animate-pulse">📤</div>
            <h2 id="trackerTitle" class="font-black text-2xl mb-2 text-gray-800">Order Sent!</h2>
            <p id="trackerSubtitle" class="text-gray-600 mb-6">Waiting for the cashier to review your order...</p>
            
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 w-full mb-8">
                <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Estimated Wait Time</div>
                <div id="waitTimeDisplay" class="text-xl font-black text-red-600">10 - 15 Mins</div>
            </div>

            <button onclick="location.reload()" class="bg-gray-200 text-gray-800 font-bold py-3 px-6 rounded-lg w-full">Place New Order</button>
        </div>

        <!-- ITEM MODAL (Pops up when they click an item) -->
        <div id="itemModal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-end sm:items-center justify-center">
            <div class="bg-white w-full max-w-md sm:rounded-xl rounded-t-2xl overflow-hidden flex flex-col max-h-[90vh]">
                <div id="modalImage" class="w-full h-48 bg-gray-200 flex items-center justify-center text-4xl">🍲</div>
                <div class="p-5 flex-1 overflow-y-auto">
                    <div class="flex justify-between items-start mb-2">
                        <h2 id="modalItemName" class="text-xl font-black text-gray-800">Item Name</h2>
                        <span id="modalItemPrice" class="text-lg font-bold text-red-600">₱0.00</span>
                    </div>
                    
                    <div id="modalAddonsContainer" class="mt-4 hidden">
                        <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">Add-ons</h3>
                        <div id="modalAddonsList" class="space-y-2"></div>
                    </div>

                    <div class="mt-4">
                        <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">Special Instructions</h3>
                        <input type="text" id="modalNotes" class="w-full border rounded-lg p-2 text-sm outline-none focus:border-red-500" placeholder="e.g. No mayo, extra spicy...">
                    </div>
                </div>

                <div class="p-5 bg-gray-50 border-t flex items-center gap-4">
                    <div class="flex items-center bg-white border rounded-lg shadow-sm">
                        <button onclick="changeModalQty(-1)" class="w-10 h-10 font-bold text-gray-600 active:bg-gray-100">-</button>
                        <span id="modalQty" class="w-8 text-center font-bold text-gray-800">1</span>
                        <button onclick="changeModalQty(1)" class="w-10 h-10 font-bold text-gray-600 active:bg-gray-100">+</button>
                    </div>
                    <button onclick="addModalItemToCart()" class="flex-1 bg-red-600 text-white font-bold py-3 rounded-lg shadow-md active:scale-95 transition">
                        Add to Order
                    </button>
                    <button onclick="closeItemModal()" class="w-10 h-10 flex items-center justify-center bg-gray-200 text-gray-600 rounded-lg font-bold">✖</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        // IMPORT onSnapshot FOR LIVE TRACKING!
        import { getFirestore, collection, addDoc, getDocs, serverTimestamp, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmAWBbW7tTnIQkm2kTcJ-MLrjKHNGKcp4",
            authDomain: "takodeal-pos.firebaseapp.com",
            projectId: "takodeal-pos",
            storageBucket: "takodeal-pos.firebasestorage.app",
            messagingSenderId: "248826111383",
            appId: "1:248826111383:web:48bf1e2c172298079bd0d2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.masterMenu = [];
        window.cart = [];
        window.activeModalItem = null;

        const hiddenCategories = ["consumables", "prep batch", "raw materials", "packaging"];

        async function loadLiveMenu() {
            try {
                const snap = await getDocs(collection(db, "menu"));
                let categoriesMap = {};

                snap.forEach(docSnap => {
                    const item = docSnap.data();
                    item.id = docSnap.id;
                    let catName = item.category || "Other";
                    let isHidden = hiddenCategories.includes(catName.toLowerCase());

                    if (item.isAvailable !== false && !isHidden) {
                        window.masterMenu.push(item);
                        if (!categoriesMap[catName]) categoriesMap[catName] = [];
                        categoriesMap[catName].push(item);
                    }
                });
                renderAccordions(categoriesMap);
            } catch (error) {
                console.error(error);
                document.getElementById('liveMenuContainer').innerHTML = '<div class="text-center py-8 text-red-400">Failed to load menu.</div>';
            }
        }

        function renderAccordions(categoriesMap) {
            const container = document.getElementById('liveMenuContainer');
            container.innerHTML = '';

            for (const [category, items] of Object.entries(categoriesMap)) {
                let itemsHtml = items.map(item => {
                    let price = parseFloat(item.price || item.basePrice || 0);
                    let safeData = encodeURIComponent(JSON.stringify(item));
                    let imgHtml = item.image ? `<img src="${item.image}" class="w-20 h-20 object-cover rounded-lg">` : `<div class="w-20 h-20 bg-gray-100 rounded-lg flex items-center justify-center text-2xl border border-gray-200">🍲</div>`;

                    return `
                        <div class="menu-item-row flex items-center p-3 bg-white border border-gray-100 rounded-xl shadow-sm mb-3 cursor-pointer active:scale-95 transition" onclick="openItemModal('${safeData}')" data-name="${item.name.toLowerCase()}">
                            ${imgHtml}
                            <div class="ml-3 flex-1">
                                <h4 class="font-bold text-sm text-gray-800">${item.name}</h4>
                                <p class="text-xs font-bold text-red-600 mt-1">₱${price.toFixed(2)}</p>
                            </div>
                            <div class="text-red-500 font-bold bg-red-50 w-8 h-8 rounded-full flex items-center justify-center">+</div>
                        </div>
                    `;
                }).join('');

                // Removed the "open" attribute so it is CLOSED by default!
                container.innerHTML += `
                    <details class="category-accordion bg-white rounded-xl shadow-sm border border-gray-200 group overflow-hidden mb-3">
                        <summary class="font-black p-4 cursor-pointer flex justify-between items-center bg-gray-50 select-none">
                            ${category.toUpperCase()} 
                            <span class="group-open:rotate-180 transition-transform duration-300 text-gray-400">▼</span>
                        </summary>
                        <div class="p-3 bg-gray-50 border-t border-gray-100">
                            ${itemsHtml}
                        </div>
                    </details>
                `;
            }
        }

        // --- SEARCH ENGINE ---
        window.filterMenu = function() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let accordions = document.querySelectorAll('.category-accordion');

            accordions.forEach(acc => {
                let items = acc.querySelectorAll('.menu-item-row');
                let hasVisibleItems = false;

                items.forEach(item => {
                    let name = item.getAttribute('data-name');
                    if (name.includes(input)) {
                        item.style.display = 'flex';
                        hasVisibleItems = true;
                    } else {
                        item.style.display = 'none';
                    }
                });

                // If searching, automatically open the accordion. If empty, hide the whole category.
                if (input.length > 0) {
                    acc.open = true;
                }
                acc.style.display = hasVisibleItems ? 'block' : 'none';
            });
        }

        // --- MODAL LOGIC ---
        window.openItemModal = function(encodedData) {
            const item = JSON.parse(decodeURIComponent(encodedData));
            window.activeModalItem = { ...item, selectedQty: 1 };
            let price = parseFloat(item.price || item.basePrice || 0);

            document.getElementById('modalItemName').innerText = item.name;
            document.getElementById('modalItemPrice').innerText = '₱' + price.toFixed(2);
            document.getElementById('modalQty').innerText = '1';
            document.getElementById('modalNotes').value = '';

            const imgContainer = document.getElementById('modalImage');
            if (item.image) imgContainer.innerHTML = `<img src="${item.image}" class="w-full h-full object-cover">`;
            else imgContainer.innerHTML = '🍲';

            const addonsContainer = document.getElementById('modalAddonsContainer');
            const addonsList = document.getElementById('modalAddonsList');
            addonsList.innerHTML = '';
            
            if (item.addons && item.addons.length > 0) {
                addonsContainer.classList.remove('hidden');
                item.addons.forEach((addon, idx) => {
                    let aPrice = parseFloat(addon.price || 0);
                    let priceLabel = aPrice > 0 ? `(+₱${aPrice})` : '(Free)';
                    addonsList.innerHTML += `
                        <label class="flex items-center justify-between p-3 border rounded-lg bg-white shadow-sm cursor-pointer active:bg-gray-50">
                            <span class="text-sm font-bold text-gray-700">${addon.name} <span class="text-red-500 font-normal text-xs">${priceLabel}</span></span>
                            <input type="checkbox" id="addon-${idx}" value="${addon.name}|${aPrice}" class="w-5 h-5 text-red-600 rounded border-gray-300 focus:ring-red-500">
                        </label>
                    `;
                });
            } else { addonsContainer.classList.add('hidden'); }

            document.getElementById('itemModal').classList.remove('hidden');
        }

        window.closeItemModal = function() {
            document.getElementById('itemModal').classList.add('hidden');
            window.activeModalItem = null;
        }

        window.changeModalQty = function(delta) {
            if (!window.activeModalItem) return;
            let current = window.activeModalItem.selectedQty;
            if (current + delta > 0) {
                window.activeModalItem.selectedQty = current + delta;
                document.getElementById('modalQty').innerText = window.activeModalItem.selectedQty;
            }
        }

        window.addModalItemToCart = function() {
            let basePrice = parseFloat(window.activeModalItem.price || window.activeModalItem.basePrice || 0);
            let qty = window.activeModalItem.selectedQty;
            let notes = document.getElementById('modalNotes').value.trim();
            
            let activeAddons = {};
            let addonsTotal = 0;
            document.querySelectorAll('#modalAddonsList input[type="checkbox"]:checked').forEach(cb => {
                let parts = cb.value.split('|');
                activeAddons[parts[0]] = { name: parts[0], price: parseFloat(parts[1]), qty: 1 };
                addonsTotal += parseFloat(parts[1]);
            });

            window.cart.push({
                name: window.activeModalItem.name,
                quantity: qty,
                price: basePrice,
                variantName: 'Standard',
                lineTotalFinal: (basePrice + addonsTotal) * qty,
                addons: activeAddons,
                notes: notes
            });

            updateCartUI();
            closeItemModal();
        }

        function updateCartUI() {
            let grandTotal = 0; let totalItems = 0;
            window.cart.forEach(item => { grandTotal += item.lineTotalFinal; totalItems += item.quantity; });
            document.getElementById('floatingTotal').innerText = `₱${grandTotal.toFixed(2)} (${totalItems})`;
        }

        // ==========================================
        // 📍 GPS LOCATION ENGINE
        // ==========================================
        const BRANCH_ZONES = {
            "Cabantian": { lat: 7.130420626391755, lng: 125.61730998805625 }, 
            "Citygate": { lat: 7.111077615812063, lng: 125.61288981236622 },  
            "Maa": { lat: 7.078642149249695, lng: 125.58343773215358 }
            // Notice: Main Office is removed from here so it doesn't even try to measure it!
        };

        function getDistanceInMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3; const p1 = lat1 * Math.PI/180; const p2 = lat2 * Math.PI/180;
            const deltaP = (lat2-lat1) * Math.PI/180; const deltaLon = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(deltaP/2) * Math.sin(deltaP/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(deltaLon/2) * Math.sin(deltaLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function resetSubmitButton(grandTotal) {
            document.getElementById('submitBtn').innerHTML = '<span>Send Order</span><span id="floatingTotal">₱'+grandTotal.toFixed(2)+'</span>';
            document.getElementById('submitBtn').disabled = false;
        }

        // --- SUBMIT ORDER & LIVE TRACKING ---
        window.togglePaymentView = function() {
            if (document.getElementById('paymentMode').value === 'gcash') document.getElementById('gcashSection').classList.remove('hidden');
            else document.getElementById('gcashSection').classList.add('hidden');
        }

        window.submitOrder = async function() {
            if (window.cart.length === 0) { alert("Your order is empty."); return; }

            // Grab branch and clean up any accidental spaces from the URL
            const currentBranch = (new URLSearchParams(window.location.search).get('branch') || "Main Office").trim(); 
            const name = document.getElementById('customerName').value.trim();
            if (!name) { alert("Please enter your name!"); return; }

            const paymentMode = document.getElementById('paymentMode').value;
            let grandTotal = 0; window.cart.forEach(i => grandTotal += i.lineTotalFinal);

            const orderData = {
                customerName: name, branch: currentBranch, items: window.cart, totalAmount: grandTotal,
                paymentMode: paymentMode, gcashRef: paymentMode === 'gcash' ? (document.getElementById('refNumber')?.value || "") : null,
                status: "mobile_queue", timestamp: serverTimestamp()
            };

            const btn = document.getElementById('submitBtn');

            // --- THE FIREBASE BLASTER (Wrapped so we can use it for both paths) ---
            const executeOrderToFirebase = async () => {
                try {
                    btn.innerHTML = '<span class="mx-auto">Sending...</span>';

                    const docRef = await addDoc(collection(db, "incoming_orders"), orderData);
                    
                    document.getElementById('orderingScreen').classList.add('hidden');
                    document.getElementById('trackerScreen').classList.remove('hidden');
                    document.getElementById('trackerScreen').classList.add('flex');
                    window.scrollTo(0,0);

                    // LIVE TRACKING LISTENER
                    onSnapshot(doc(db, "incoming_orders", docRef.id), (snapshot) => {
                        if (snapshot.exists()) {
                            const currentStatus = snapshot.data().status;
                            const icon = document.getElementById('trackerIcon');
                            const title = document.getElementById('trackerTitle');
                            const subtitle = document.getElementById('trackerSubtitle');
                            const waitTime = document.getElementById('waitTimeDisplay');

                            if (currentStatus === "preparing") {
                                icon.innerText = "🍳";
                                icon.classList.remove('animate-pulse');
                                title.innerText = "Preparing Your Food!";
                                title.classList.add('text-green-600');
                                subtitle.innerText = "The kitchen is working on your order right now.";
                                waitTime.innerText = "Almost Ready...";
                            } 
                            else if (currentStatus === "rejected") {
                                icon.innerText = "❌";
                                icon.classList.remove('animate-pulse');
                                title.innerText = "Order Cancelled";
                                title.classList.add('text-red-600');
                                subtitle.innerText = "We're sorry, but an ingredient ran out. Please see the cashier.";
                                waitTime.innerText = "--";
                            }
                        }
                    });

                } catch (error) {
                    console.error(error); 
                    alert("Error sending order. Please check your connection.");
                    resetSubmitButton(grandTotal);
                }
            };

            // 🟢 EXCEPTION: THE BOSS TEST MODE
            if (currentBranch.includes("Main")) {
                btn.innerHTML = '<span class="mx-auto">Test Mode (Bypassing GPS)...</span>';
                btn.disabled = true;
                await executeOrderToFirebase();
                return; // THIS LINE STOPS THE GPS CHECK!
            }

            // 🔴 NORMAL CUSTOMER MODE: Strict GPS Check
            if (!navigator.geolocation) {
                alert("❌ Your browser does not support location services. Please order directly at the counter.");
                return;
            }

            btn.innerHTML = '<span class="mx-auto">Verifying Location...</span>'; 
            btn.disabled = true;

            navigator.geolocation.getCurrentPosition(async (position) => {
                const userLat = position.coords.latitude; 
                const userLng = position.coords.longitude;
                const targetZone = BRANCH_ZONES[currentBranch];

                if (targetZone) {
                    const distance = getDistanceInMeters(userLat, userLng, targetZone.lat, targetZone.lng);
                    
                    if (distance > 200) { // 200-meter safety radius
                        alert(`📍 TOO FAR AWAY\n\nYou must be near the ${currentBranch} branch to place an order. Your phone shows you are ${Math.round(distance)} meters away.\n\nIf you are at the store, please make sure your GPS is turned on and accurate.`);
                        resetSubmitButton(grandTotal);
                        return;
                    }
                }

                // If they pass the check, send the order!
                await executeOrderToFirebase();

            }, (error) => {
                alert("📍 LOCATION REQUIRED\n\nPlease allow location access to verify you are at the store, or order directly at the counter.");
                resetSubmitButton(grandTotal);
            }, { enableHighAccuracy: true }); 
        }

        loadLiveMenu();
    </script>
</body>
</html>
