<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAKODEÁL - Mobile Order</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4">

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-red-600">TAKODEÁL</h1>
            <p class="text-sm text-gray-500">Your ideal takoyaki & COFFEE CHERY</p>
        </div>

        <form id="orderForm" class="space-y-4">
            <!-- Customer Name -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Your Name</label>
                <input type="text" id="customerName" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-red-500 focus:ring-red-500" placeholder="e.g. John Doe">
            </div>

            <!-- Simulated Menu Selection -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Select Items</label>
                
                <div class="flex items-center justify-between p-2 border rounded mb-2">
                    <div>
                        <p class="font-bold">Takoyaki - 8pcs</p>
                        <p class="text-sm text-gray-500">₱100.00</p>
                    </div>
                    <input type="number" id="qtyTako" min="0" value="0" class="w-16 p-1 border rounded text-center">
                </div>

                <div class="flex items-center justify-between p-2 border rounded">
                    <div>
                        <p class="font-bold">COFFEE CHERY - Iced Caramel</p>
                        <p class="text-sm text-gray-500">₱120.00</p>
                    </div>
                    <input type="number" id="qtyCoffee" min="0" value="0" class="w-16 p-1 border rounded text-center">
                </div>
            </div>

            <!-- Payment Method -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Mode of Payment</label>
                <select id="paymentMode" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-red-500 focus:ring-red-500" onchange="togglePaymentView()">
                    <option value="cash">Cash (Pay at counter)</option>
                    <option value="gcash">GCash</option>
                </select>
            </div>

            <!-- Hidden GCash Section -->
            <div id="gcashSection" class="hidden bg-blue-50 p-4 rounded-md border border-blue-200 text-center">
                <p class="font-bold text-blue-800 mb-2">Pay via GCash</p>
                <!-- Placeholder for your actual QR Code -->
                <div class="w-40 h-40 bg-gray-300 mx-auto flex items-center justify-center mb-2">
                    <span class="text-gray-500 text-sm">[Your QR Code Here]</span>
                </div>
                <p class="text-sm font-bold">Account Name: JOSTUART O.</p>
                <p class="text-sm mb-2">Account No: 09XX-XXX-XXXX</p>
                <input type="text" id="refNumber" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border text-sm" placeholder="Enter GCash Ref No.">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-red-600 text-white font-bold py-3 px-4 rounded hover:bg-red-700 transition">
                Send Order
            </button>
        </form>

        <div id="successMessage" class="hidden mt-4 p-4 bg-green-100 text-green-700 rounded-md text-center">
            Order sent! Please wait for your name to be called.
        </div>
    </div>

    <!-- Firebase Integration -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // TODO: Replace with your actual Firebase config
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Handle Payment Toggle
        window.togglePaymentView = function() {
            const mode = document.getElementById('paymentMode').value;
            const gcashSection = document.getElementById('gcashSection');
            if (mode === 'gcash') {
                gcashSection.classList.remove('hidden');
            } else {
                gcashSection.classList.add('hidden');
            }
        }

        // Handle Order Submission
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('customerName').value;
            const paymentMode = document.getElementById('paymentMode').value;
            const refNumber = document.getElementById('refNumber')?.value || "";
            
            const qtyTako = parseInt(document.getElementById('qtyTako').value);
            const qtyCoffee = parseInt(document.getElementById('qtyCoffee').value);

            let items = [];
            let totalAmount = 0;

            if (qtyTako > 0) {
                items.push({ name: "Takoyaki - 8pcs", quantity: qtyTako, price: 100 });
                totalAmount += (qtyTako * 100);
            }
            if (qtyCoffee > 0) {
                items.push({ name: "COFFEE CHERY - Iced Caramel", quantity: qtyCoffee, price: 120 });
                totalAmount += (qtyCoffee * 120);
            }

            if (items.length === 0) {
                alert("Please add at least one item to your order.");
                return;
            }

            const orderData = {
                customerName: name,
                items: items,
                totalAmount: totalAmount,
                paymentMode: paymentMode,
                gcashRef: paymentMode === 'gcash' ? refNumber : null,
                status: "mobile_queue",
                timestamp: serverTimestamp()
            };

            try {
                // Send to Firebase
                await addDoc(collection(db, "incoming_orders"), orderData);
                
                // Show Success
                document.getElementById('orderForm').classList.add('hidden');
                document.getElementById('successMessage').classList.remove('hidden');
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Error sending order. Please try again.");
            }
        });
    </script>
</body>
</html>
