<header>TAKODEÁL OWNER · SCHEDULE MANAGER · LOCAL TEST</header><main><h1>Save an existing November schedule</h1><p>Fictional records only. This fixture loads the actual calendar-review controller, dialog and versioned-save controller. No Firebase or business-data connections are configured.</p>

<script type="module">
