<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../takodeal-manager/"><title>Fictional Waste Inventory Review</title><link rel="stylesheet" href="inventory-history-workspace.css"><style>body{margin:0;background:#f4f7f1;color:#173f33;font:15px system-ui,sans-serif}main{max-width:1150px;margin:24px auto;padding:20px}button,input,select,textarea{font:inherit}button{cursor:pointer}#fixtureNotice{padding:14px;border:1px solid #dbc988;background:#fff8df;border-radius:10px}#fixtureOutcome{padding:12px;background:white;border:1px solid #cdded2;border-radius:10px;white-space:pre-wrap}textarea{display:block;box-sizing:border-box;width:100%;padding:12px;border:1px solid #cdded2;border-radius:8px}</style></head><body><main><p id="fixtureNotice">Fictional local test. Uses the actual inventory history and review installers with a memory-only database. No Firebase requests or live stock changes.</p><h1>Waste &amp; Spoilage</h1><p>Current memory stock: <strong id="fixtureStock">100 piece</strong></p><section id="invSectionWaste"></section><p id="fixtureOutcome" role="status">Pending waste report is ready for inventory review.</p></main><script type="module">
import {installInventoryHistoryWorkspace} from './inventory-history-workspace.js';
import {OWNER_EMAIL} from './workspace-access-model.js';
const copy=value=>structuredClone(value),store=new Map(),now=new Date(),branch='Fictional branch';
store.set('hq_managers/demo',{email:OWNER_EMAIL,role:'Owner',pin:'fictional-only',permissions:['all'],assignedBranch:'All'});
store.set('branches/demo',{name:branch});store.set('inventory/demo-bowl',{name:'Paper bowl',branch,uom:'piece',purchaseUom:'Pack',conversionRate:50,currentStock:100,baseCost:2});
store.set('staff_requests/demo-waste',{type:'Waste Report',branch,staffName:'Fictional Cashier',timestamp:now,status:'Pending',totalValueLost:10,items:[{id:'demo-bowl',name:'Paper bowl',qty:5,uom:'piece',rawQty:5,displayUom:'piece',reason:'Damaged packaging during preparation',photoUrl:''}]});
const snapshot=ref=>({id:ref.id,exists:()=>store.has(ref.path),data:()=>copy(store.get(ref.path))}),doc=(_,table,id)=>({table,id,path:table+'/'+id});
Object.assign(window,{db:{},auth:{currentUser:{uid:'demo-owner',email:OWNER_EMAIL,emailVerified:true}},sessionUser:{uid:'demo-owner',email:OWNER_EMAIL,role:'Owner',permissions:['all'],allowedBranches:['All'],cashierName:'Fictional reviewer'},doc,collection:(_,table)=>({table}),where:(key,op,value)=>({kind:'where',key,op,value}),orderBy:(key,order)=>({kind:'order',key,order}),limit:value=>({kind:'limit',value}),startAfter:snap=>({kind:'after',id:snap.id}),getDocFromServer:async ref=>snapshot(ref),serverTimestamp:()=>new Date(),getDocsFromServer:async query=>{
 let rows=[...store].filter(([key])=>key.startsWith(query.table+'/')).map(([key,value])=>({id:key.slice(query.table.length+1),value}));
 for(const filter of query.filters||[])if(filter.kind==='where')rows=rows.filter(row=>filter.op==='=='?row.value[filter.key]===filter.value:filter.op==='>='?row.value[filter.key]>=filter.value:row.value[filter.key]<filter.value);
 const order=query.filters?.find(filter=>filter.kind==='order');if(order)rows.sort((a,b)=>+b.value[order.key]-+a.value[order.key]);const cursor=query.filters?.find(filter=>filter.kind==='after');if(cursor)rows=rows.slice(rows.findIndex(row=>row.id===cursor.id)+1);const cap=query.filters?.find(filter=>filter.kind==='limit');if(cap)rows=rows.slice(0,cap.value);return {docs:rows.map(row=>({id:row.id,data:()=>copy(row.value)}))};
 },query:(base,...filters)=>({...base,filters}),runTransaction:async(_,work)=>{
 const writes=[],tx={get:async ref=>{if(writes.length)throw Error('Read after write');return snapshot(ref);},set:(ref,value)=>writes.push([ref.path,copy(value)]),update:(ref,value)=>writes.push([ref.path,{...copy(store.get(ref.path)),...copy(value)}])};const result=await work(tx);for(const [key,value]of writes)store.set(key,value);document.getElementById('fixtureStock').textContent=store.get('inventory/demo-bowl').currentStock+' piece';return result;
 },ManagerUI:{notify:message=>{document.getElementById('fixtureOutcome').textContent=message+'\nSaved report: '+store.get('staff_requests/demo-waste').status+'\nStock audit records: '+[...store.keys()].filter(key=>key.startsWith('stock_logs/')).length;}},invalidateCache:()=>{}});
installInventoryHistoryWorkspace(window,document);await window.loadWasteTabLogs();
</script></body></html>
