name: Dashboard and sale safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  calculations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            functions/staff-document-broker/package-lock.json
            functions/staff-device-setup/package-lock.json
            functions/cash-remittance-review/package-lock.json
      - name: Install locked private document runtime
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix functions/staff-document-broker
      - name: Verify real private document SDK without cloud access
        run: node tools/private-broker-sdk-check.mjs
      - name: Install locked Staff device setup runtime
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix functions/staff-device-setup
      - name: Verify Staff device setup SDK without cloud access
        run: node tools/staff-device-setup-sdk-check.mjs
      - name: Install locked cash remittance review runtime
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix functions/cash-remittance-review
      - name: Verify real cash remittance SDK without cloud access
        run: node tools/cash-remittance-sdk-check.mjs
      - name: Verify generated security rules match the readable policy
        run: node tools/build-firestore-rules.mjs --check
      - name: Check workspace scripts
        run: |
          for script in takodeal-manager/*.js Takodeal-POS/*.js Customer/*.js takodeal-staff/*.js takodeal-franchise/*.js takodeal-delivery/*.js; do node --check "$script"; done
      - name: Verify dashboard, checkout, inventory, recipes and payroll
        run: |
          # The dedicated multi-tab browser suite requires a separate Playwright setup.
          tests=()
          for test in tests/*.test.mjs; do
            [[ "$test" == tests/outbox-browser.test.mjs ]] || tests+=("$test")
          done
          node --test "${tests[@]}"
