name: Dashboard and sale safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  calculations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check workspace scripts
        run: |
          for script in takodeal-manager/*.js Takodeal-POS/*.js Customer/*.js takodeal-staff/*.js takodeal-franchise/*.js; do node --check "$script"; done
      - name: Verify dashboard, checkout, inventory, recipes and payroll
        run: node --test tests/dashboard-data.test.mjs tests/pos-safety.test.mjs tests/pending-sales.test.mjs tests/recipe-repair.test.mjs tests/payroll-safety.test.mjs tests/branch-operations.test.mjs tests/franchise-bills.test.mjs tests/manager-login.test.mjs tests/employee-id.test.mjs tests/customer-menu.test.mjs tests/staff-portal.test.mjs tests/cashier-workspace.test.mjs tests/staff-phone.test.mjs tests/shift-close-draft.test.mjs tests/printer-connection.test.mjs tests/cashier-checkout-controls.test.mjs tests/ai-hub.test.mjs tests/access-workspace.test.mjs tests/pos-config.test.mjs tests/franchise-workspace.test.mjs tests/workspace-access.test.mjs tests/inventory-review.test.mjs
