name: Manual Time Out backend checks

on:
  push:
    branches: [fix/owner-manual-timeout-backend-20261115]

permissions:
  contents: read

concurrency:
  group: manual-timeout-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/fix/owner-manual-timeout-backend-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OWNER_REGRESSION_REF: afade4cf34d99f7e0983cd751eaffd4dd66120ae
    defaults:
      run:
        shell: bash
    steps:
      # Official actions/* v4 commits verified on 2026-11-10.
      - name: Check out the exact pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # The receipt-engine boundary test reads the exact stable base commit.
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install locked private document runtime
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix functions/staff-document-broker
      - name: Verify private document SDK without cloud access
        run: node tools/private-broker-sdk-check.mjs

      - name: Install locked Staff device setup runtime
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix functions/staff-device-setup
      - name: Verify Staff device setup SDK without cloud access
        run: node tools/staff-device-setup-sdk-check.mjs

      - name: Install locked cash remittance runtime
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix functions/cash-remittance-review
      - name: Verify cash remittance SDK without cloud access
        run: node tools/cash-remittance-sdk-check.mjs

      - name: Verify generated security rules
        run: node tools/build-firestore-rules.mjs --check

      - name: Use Java 21 for isolated HR regression tests
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked isolated database test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tests/fixtures/prep-hosted-tools

      - name: Download and verify the exact official database emulator
        run: node tools/prepare-prep-hosted-emulator.mjs

      - name: Prepare the exact unchanged Owner HR and OT regression source
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/manual-timeout-owner-regression" "$OWNER_REGRESSION_REF"
          test "$(git -C "$RUNNER_TEMP/manual-timeout-owner-regression" rev-parse HEAD)" = "$OWNER_REGRESSION_REF"
          printf 'Backend source: %s\nOwner HR/OT source: %s\n' "$(git rev-parse HEAD)" "$OWNER_REGRESSION_REF"

      - name: Verify HR recovery with actual Firestore SDK and exact live rules
        working-directory: ${{ runner.temp }}/manual-timeout-owner-regression
        env:
          TAKODEAL_TEST_TOOLS: ${{ github.workspace }}/tests/fixtures/prep-hosted-tools
        run: node --test --test-reporter=tap --test-concurrency=1 tests/owner-staff-request-live.emulator.mjs

      - name: Verify OT grant removal and payment with actual Firestore SDK and exact live rules
        working-directory: ${{ runner.temp }}/manual-timeout-owner-regression
        env:
          TAKODEAL_TEST_TOOLS: ${{ github.workspace }}/tests/fixtures/prep-hosted-tools
        run: node --test --test-reporter=tap --test-concurrency=1 tests/payroll-overtime-live.emulator.mjs

      - name: Verify protected Owner departures and missing-only mode with actual Admin SDK
        run: node --test --test-reporter=tap --test-concurrency=1 tests/owner-time-out-server.emulator.mjs

      - name: Check scripts in all six apps
        run: |
          set -euo pipefail
          for script in takodeal-manager/*.js Takodeal-POS/*.js Customer/*.js takodeal-staff/*.js takodeal-franchise/*.js takodeal-delivery/*.js; do
            node --check "$script"
          done

      - name: Run the normal test suite
        run: |
          set -euo pipefail
          # The optional browser suite needs a separately installed browser.
          tests=()
          for test in tests/*.test.mjs; do
            [[ "$test" == tests/outbox-browser.test.mjs ]] || tests+=("$test")
          done
          node --test --test-reporter=tap --test-concurrency=2 "${tests[@]}"
