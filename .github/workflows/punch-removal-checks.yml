name: Attendance punch removal
on:
  push:
    branches: [fix/owner-reviewed-punch-removal-20261119]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tests/fixtures/prep-hosted-tools
      - run: node tools/prepare-prep-hosted-emulator.mjs
      - run: node tools/build-firestore-rules.mjs --check
      - run: node --test tests/attendance-log-removal.test.mjs tests/hr-review-ui.test.mjs
      - name: Test the production rules patch and repository rules against fictional punches
        shell: bash
        run: |
          export TAKODEAL_RULE_TEST_RUNTIME="$TAKODEAL_TEST_TOOLS"
          for fixture in active32cdf repository; do
            TAKODEAL_PUNCH_RULES_FIXTURE="$fixture" node --test --test-name-pattern="reviewed punches require" tests/emergency-relief-rules.emulator.mjs
          done
