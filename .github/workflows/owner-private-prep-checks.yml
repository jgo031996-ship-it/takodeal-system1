name: Owner private prep branch checks

on:
  push:
    branches: [fix/owner-private-prep-reviews]

permissions:
  contents: read

concurrency:
  group: owner-private-prep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/fix/owner-private-prep-reviews'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact pushed Owner commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked private document runtime
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix functions/staff-document-broker
      - name: Verify private document SDK without cloud access
        run: node tools/private-broker-sdk-check.mjs
      - name: Install locked Staff setup runtime
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix functions/staff-device-setup
      - name: Verify Staff setup SDK without cloud access
        run: node tools/staff-device-setup-sdk-check.mjs
      - name: Install locked cash remittance runtime
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix functions/cash-remittance-review
      - name: Verify cash remittance SDK without cloud access
        run: node tools/cash-remittance-sdk-check.mjs
      - name: Verify unchanged generated repository rules
        run: node tools/build-firestore-rules.mjs --check
      - name: Check all six app script syntax
        run: |
          set -euo pipefail
          for script in takodeal-manager/*.js Takodeal-POS/*.js Customer/*.js takodeal-staff/*.js takodeal-franchise/*.js takodeal-delivery/*.js; do
            node --check "$script"
          done
      - name: Run complete normal tests sequentially
        run: |
          set -euo pipefail
          tests=()
          for test in tests/*.test.mjs; do
            [[ "$test" == tests/outbox-browser.test.mjs ]] || tests+=("$test")
          done
          node --test --test-concurrency=1 "${tests[@]}"
